name: CI Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rebuild ChromaDB indexes
        run: python -m scripts.rebuild_indexes
      - name: Run master verification runner
        run: python -m scripts.run_final_verification
      - name: Run automated test suite
        run: python -m pytest -q
